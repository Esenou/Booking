{% extends 'blog/base.html' %}

{% block content %}
    <div class="container-narrow">
        <h1>Log in</h1>
        <form method="POST">{% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Log in</button>
            <a href="{% url 'hotel_list' %}" class="btn btn-default">Cancel</a>
        </form>
        <p style="margin-top: 1rem;">Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p>
    </div>
{% endblock %}
