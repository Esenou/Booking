{% extends 'blog/base.html' %}

{% block content %}
    <div class="container-narrow">
        <h1>Sign up</h1>
        <form method="POST">{% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Sign up</button>
            <a href="{% url 'hotel_list' %}" class="btn btn-default">Cancel</a>
        </form>
        <p style="margin-top: 1rem;">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
    </div>
{% endblock %}
