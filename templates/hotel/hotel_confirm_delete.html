{% extends 'blog/base.html' %}

{% block content %}
    <h1>Delete hotel</h1>
    <p>Are you sure you want to delete "{{ hotel.title }}"?</p>
    <form method="POST">{% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'hotel_detail' pk=hotel.pk %}" class="btn btn-default">Cancel</a>
    </form>
{% endblock %}
