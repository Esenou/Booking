{% extends 'blog/base.html' %}

{% block content %}
    <div class="container-narrow">
        <h1>Delete hotel</h1>
        <div class="card">
            <p>Are you sure you want to delete <strong>{{ hotel.title }}</strong>?</p>
            <form method="POST">{% csrf_token %}
                <button type="submit" class="btn btn-danger">Delete</button>
                <a href="{% url 'hotel_detail' pk=hotel.pk %}" class="btn btn-default">Cancel</a>
            </form>
        </div>
    </div>
{% endblock %}
