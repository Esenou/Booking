{% extends 'blog/base.html' %}

{% block content %}
    <h1>Review {{ hotel.title }}</h1>
    <form method="POST">{% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save review</button>
        <a href="{% url 'hotel_detail' pk=hotel.pk %}" class="btn btn-default">Cancel</a>
    </form>
{% endblock %}
